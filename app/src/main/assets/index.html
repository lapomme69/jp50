<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일본어 가나 음성 퀴즈 V15 Native Voice</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;background:#f0f4f8;padding:20px;margin:0}
.card{background:#fff;padding:25px 20px;border-radius:16px;display:inline-block;box-shadow:0 4px 15px rgba(0,0,0,.1);width:100%;max-width:360px;box-sizing:border-box}
.toggle-group{margin-bottom:12px}.mode-btn{padding:8px 16px;margin:0 4px;border:1px solid #cbd5e1;background:#f8fafc;border-radius:8px;cursor:pointer;font-size:15px;color:#475569}.mode-btn.active{background:#4f46e5;color:#fff;border-color:#4f46e5;font-weight:bold}
.kana{font-size:90px;font-weight:bold;color:#1e293b;margin:10px 0;line-height:100px;min-height:100px}
.btn-large{font-size:18px;padding:14px 24px;border:none;border-radius:30px;cursor:pointer;font-weight:bold;margin:8px 0;transition:all .2s;width:100%;box-shadow:0 4px 10px rgba(0,0,0,.1)}
.start-btn{background:#22c55e;color:#fff}.start-btn.listening{background:#ef4444;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}70%{box-shadow:0 0 0 15px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
.wave-container{width:100%;height:40px;background:#0f172a;border-radius:8px;margin:10px 0;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;box-sizing:border-box}
.wave-bar{width:8px;height:6px;background:#38bdf8;border-radius:4px;transition:height .2s}.wave-container.active .wave-bar{animation:soundWave 1.2s ease-in-out infinite;background:#ef4444}
.wave-container.active .wave-bar:nth-child(1){animation-delay:0s}.wave-container.active .wave-bar:nth-child(2){animation-delay:.2s}.wave-container.active .wave-bar:nth-child(3){animation-delay:.4s}.wave-container.active .wave-bar:nth-child(4){animation-delay:.2s}.wave-container.active .wave-bar:nth-child(5){animation-delay:0s}
@keyframes soundWave{0%,100%{height:6px}50%{height:28px}}
.timer-text{font-size:16px;color:#ef4444;font-weight:bold;margin-top:4px;min-height:22px}
.progress-container{width:100%;background:#e2e8f0;border-radius:10px;height:8px;margin:6px 0;overflow:hidden;display:none}.progress-bar{height:100%;width:100%;background:#ef4444;border-radius:10px;transition:width .05s linear}
.status{margin-top:8px;font-size:14px;color:#475569;font-weight:bold;min-height:24px;line-height:1.4;word-break:keep-all}.result{font-weight:bold;margin-top:8px;font-size:18px;min-height:28px}.score{margin-top:10px;font-weight:bold;color:#475569;font-size:16px}
</style>
</head>
<body>
<div class="card">
<div class="toggle-group">
<button class="mode-btn active" onclick="setKanaMode('h',this)">히라가나</button>
<button class="mode-btn" onclick="setKanaMode('k',this)">가타카나</button>
</div>
<div class="kana" id="kana">あ</div>
<button class="btn-large start-btn" id="startBtn" onclick="toggleQuiz()">▶ 시작</button>
<div class="wave-container" id="waveContainer"><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div></div>
<div class="timer-text" id="timerText"></div>
<div class="progress-container" id="progressContainer"><div class="progress-bar" id="progressBar"></div></div>
<div class="status" id="status">[시작] 버튼을 누르면 퀴즈가 시작됩니다.</div>
<div class="result" id="result"></div>
<div class="score">남은 글자: <span id="score">0</span></div>
</div>

<script>
const hData=[
{k:"あ",a:["아","a","あ"]},{k:"い",a:["이","i","い"]},{k:"う",a:["우","u","う"]},{k:"え",a:["에","e","え"]},{k:"お",a:["오","o","お"]},
{k:"か",a:["카","ka","か"]},{k:"き",a:["키","ki","き"]},{k:"く",a:["쿠","ku","く"]},{k:"け",a:["케","ke","け"]},{k:"こ",a:["코","ko","こ"]},
{k:"さ",a:["사","sa","さ"]},{k:"し",a:["시","shi","し"]},{k:"す",a:["스","su","す"]},{k:"せ",a:["세","se","せ"]},{k:"そ",a:["소","so","そ"]},
{k:"た",a:["타","ta","た"]},{k:"ち",a:["치","chi","ち"]},{k:"つ",a:["츠","tsu","つ"]},{k:"て",a:["테","te","て"]},{k:"と",a:["토","to","と"]},
{k:"な",a:["나","na","な"]},{k:"に",a:["니","ni","に"]},{k:"ぬ",a:["누","nu","ぬ"]},{k:"ね",a:["네","ne","ね"]},{k:"の",a:["노","no","の"]}
];
const kData=[
{k:"ア",a:["아","a","ア"]},{k:"イ",a:["이","i","イ"]},{k:"ウ",a:["우","u","ウ"]},{k:"エ",a:["에","e","エ"]},{k:"オ",a:["오","o","オ"]},
{k:"カ",a:["카","ka","カ"]},{k:"キ",a:["키","ki","キ"]},{k:"ク",a:["쿠","ku","ク"]},{k:"ケ",a:["케","ke","ケ"]},{k:"コ",a:["코","ko","コ"]},
{k:"サ",a:["사","sa","サ"]},{k:"シ",a:["시","shi","シ"]},{k:"ス",a:["스","su","ス"]},{k:"セ",a:["세","se","セ"]},{k:"ソ",a:["소","so","ソ"]},
{k:"タ",a:["타","ta","タ"]},{k:"チ",a:["치","chi","チ"]},{k:"ツ",a:["츠","tsu","ツ"]},{k:"テ",a:["테","te","テ"]},{k:"ト",a:["토","to","ト"]},
{k:"ナ",a:["나","na","ナ"]},{k:"ニ",a:["니","ni","ニ"]},{k:"ヌ",a:["누","nu","ヌ"]},{k:"ネ",a:["네","ne","ネ"]},{k:"ノ",a:["노","no","ノ"]}
];

let activeQuestions=[...hData],current=null,isListening=false,isAnswered=false;
let timerInterval=null,timeoutId=null;
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null;

function unlockAudio(){
 if("speechSynthesis" in window){
   window.speechSynthesis.cancel();
   const u=new SpeechSynthesisUtterance("");
   u.lang="ja-JP";
   window.speechSynthesis.speak(u);
 }
}

function speakJapaneseKana(text){
 if(!text)return;

 // Android APK에서는 반드시 Android Native TTS 사용
 if(window.AndroidVoice){
   try{
     window.AndroidVoice.speak(text);
     return;
   }catch(e){
     console.log("Android TTS 오류:",e);
   }
 }

 // PC/일반 브라우저 fallback
 if("speechSynthesis" in window){
   window.speechSynthesis.cancel();
   const speak=()=>{
     const u=new SpeechSynthesisUtterance(text);
     u.lang="ja-JP";u.rate=.8;u.volume=1;
     const voices=window.speechSynthesis.getVoices();
     const ja=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("ja"));
     if(ja)u.voice=ja;
     window.speechSynthesis.speak(u);
   };
   if(window.speechSynthesis.getVoices().length)speak();
   else window.speechSynthesis.onvoiceschanged=speak;
 }
}

function initSpeechEngine(){
 if(!SpeechRecognition)return;
 recognition=new SpeechRecognition();
 // 한국어/일본어 발음을 모두 인식할 수 있도록 일본어 인식 우선
 recognition.lang="ja-JP";
 recognition.interimResults=false;
 recognition.continuous=false;
 recognition.maxAlternatives=5;

 recognition.onresult=e=>{
   if(!isListening||isAnswered)return;
   let text="";
   for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;
   if(text.trim())checkAnswer(text.trim());
 };
 recognition.onerror=e=>{
   console.log("음성인식:",e.error);
   if(e.error==="not-allowed"||e.error==="service-not-allowed"){
     isAnswered=true;stopListeningUI();
     document.getElementById("status").innerText="마이크 권한을 허용해 주세요.";
   }
 };
 recognition.onend=()=>{
   if(isListening&&!isAnswered){
     setTimeout(()=>{try{recognition.start()}catch(e){}},80);
   }
 };
}

function toggleQuiz(){
 unlockAudio();
 if(isListening)stopQuiz();
 else startQuizSession();
}

function startQuizSession(){
 const nativeAndroid=!!window.AndroidVoice;

 if(!nativeAndroid && !SpeechRecognition){
   alert("이 기기/브라우저에서는 음성 인식을 지원하지 않습니다.");
   return;
 }
 if(activeQuestions.length===0){resetMode();return;}

 isListening=true;isAnswered=false;
 const b=document.getElementById("startBtn");
 b.innerText="🎙️ 음성인식 중...";b.className="btn-large start-btn listening";
 document.getElementById("waveContainer").classList.add("active");
 document.getElementById("status").innerText="🎙️ 5초 안에 '아, 이, 우...'처럼 읽어 주세요!";
 run5SecTimer();

 if(nativeAndroid){
   try{
     window.AndroidVoice.startListening();
   }catch(e){
     console.log("Android 음성인식 시작 오류:",e);
     document.getElementById("status").innerText="마이크를 시작할 수 없습니다.";
   }
 }else{
   if(!recognition)initSpeechEngine();
   try{recognition.stop()}catch(e){}
   setTimeout(()=>{try{recognition.start()}catch(e){console.log(e)}},120);
 }
}

function run5SecTimer(){
 clearQuizTimers();
 document.getElementById("result").innerText="";
 const pc=document.getElementById("progressContainer"),pb=document.getElementById("progressBar"),tt=document.getElementById("timerText");
 pc.style.display="block";pb.style.width="100%";
 const start=Date.now(),duration=5000;
 timerInterval=setInterval(()=>{
   const elapsed=Date.now()-start,remain=Math.max(0,duration-elapsed);
   tt.innerText=`남은 시간: ${(remain/1000).toFixed(1)}초`;
   pb.style.width=(remain/duration*100)+"%";
   if(elapsed>=duration)clearInterval(timerInterval);
 },50);
 timeoutId=setTimeout(()=>{
   if(!isAnswered){
     isAnswered=true;stopListeningUI();
     const old=current;
     const res=document.getElementById("result");
     res.style.color="#dc2626";res.innerText=`⏱️ 시간 초과! (정답: ${old.a[0]})`;
     activeQuestions=activeQuestions.filter(q=>q.k!==old.k);
     document.getElementById("score").innerText=activeQuestions.length;
     // 시간초과도 오답으로 처리: 정답 발음 후 다음 문제
     speakJapaneseKana(old.k);
     setTimeout(()=>prepareNextQuestion(),1100);
   }
 },duration);
}

function clearQuizTimers(){
 if(timerInterval)clearInterval(timerInterval);
 if(timeoutId)clearTimeout(timeoutId);
 timerInterval=null;timeoutId=null;
}

function stopListeningUI(){
 isListening=false;clearQuizTimers();

 if(window.AndroidVoice){
   try{window.AndroidVoice.stopListening()}catch(e){}
 }
 if(recognition)try{recognition.stop()}catch(e){}

 const b=document.getElementById("startBtn");
 b.innerText="▶ 시작";b.className="btn-large start-btn";
 document.getElementById("waveContainer").classList.remove("active");
 document.getElementById("progressContainer").style.display="none";
 document.getElementById("timerText").innerText="";
}

function stopQuiz(){
 stopListeningUI();
 document.getElementById("status").innerText="음성 인식이 중지되었습니다. [시작]을 누르면 진행됩니다.";
}

function setKanaMode(mode,btn){
 stopListeningUI();
 activeQuestions=mode==="h"?[...hData]:[...kData];
 document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 resetMode();
}

function resetMode(){
 stopListeningUI();
 if(!activeQuestions.length)return;
 prepareNextQuestion();
 document.getElementById("result").innerText="";
 document.getElementById("status").innerText="[시작] 버튼을 누르면 5초간 음성 인식이 진행됩니다.";
}

function prepareNextQuestion(){
 if(activeQuestions.length===0){
   document.getElementById("kana").innerText="🎉";
   document.getElementById("result").style.color="#16a34a";
   document.getElementById("result").innerText="축하합니다! 모든 글자를 학습했습니다!";
   document.getElementById("status").innerText="다시 풀려면 상단의 [히라가나/가타카나] 버튼을 눌러주세요.";
   document.getElementById("score").innerText="0";
   return;
 }
 current=activeQuestions[Math.floor(Math.random()*activeQuestions.length)];
 document.getElementById("kana").innerText=current.k;
 document.getElementById("score").innerText=activeQuestions.length;
 document.getElementById("status").innerText="[시작]을 눌러 발음해 주세요.";
}

function normalize(s){
 return s.toLowerCase().replace(/[\s\.\,\!\?\u3001\u3002]/g,"").replace(/[ー]/g,"");
}

function checkAnswer(userInput){
 if(!current||isAnswered)return;
 const input=normalize(userInput);
 if(!input)return;

 // 인식 결과가 일본어 가나 또는 로마자/한국어 중 하나와 일치하는지 확인
 const correct=current.a.some(ans=>{
   const a=normalize(ans);
   return input===a || input.includes(a) || a.includes(input);
 });
 if(correct){
   isAnswered=true;
   stopListeningUI();
   activeQuestions=activeQuestions.filter(q=>q.k!==current.k);
   const res=document.getElementById("result");
   res.style.color="#16a34a";res.innerText="⭕ 정답입니다! 🎉";
   document.getElementById("status").innerText="다음 글자를 준비합니다...";
   document.getElementById("score").innerText=activeQuestions.length;
   // 정답에서는 원어민 발음을 재생하지 않음
   setTimeout(()=>prepareNextQuestion(),450);
 }else{
   // 오답: 발음만 들려주고 재시도하지 않고 다음 글자로 이동
   isAnswered=true;
   stopListeningUI();
   const old=current;
   activeQuestions=activeQuestions.filter(q=>q.k!==old.k);
   const res=document.getElementById("result");
   res.style.color="#dc2626";res.innerText=`❌ 오답! (정답: ${old.a[0]})`;
   document.getElementById("status").innerText="🔊 정답 발음을 들려드립니다. 다음 글자를 준비합니다...";
   document.getElementById("score").innerText=activeQuestions.length;
   speakJapaneseKana(old.k);
   setTimeout(()=>prepareNextQuestion(),1100);
 }
}


// Android SpeechRecognizer -> JavaScript callback
window.onNativeSpeechResult=function(text){
 if(!isListening||isAnswered)return;
 if(text&&text.trim())checkAnswer(text.trim());
};

window.onNativeSpeechError=function(message){
 if(!isListening||isAnswered)return;
 document.getElementById("status").innerText=message||"음성인식 오류가 발생했습니다.";
};

prepareNextQuestion();
</script>
</body>
</html>
